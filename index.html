<style>/* ============================================================
   canada-pal-learn — "Fireweed & Spruce"

   Farben aus dem Yukon, aber jede mit genau einer Aufgabe:
     Flussblau  = Englisch. Nirgends sonst.
     Fireweed   = Bedienung. Was anklickbar oder aktiv ist.
     Fichte     = richtig.   Rost = falsch.
     Blaze      = ausschliesslich die 80-Prozent-Linie.

   Schrift: Archivo schmal fuer Ueberschriften (deutsche Komposita
   passen dann aufs Handy), IBM Plex Sans als Lauftext, Plex Mono
   fuer Fundstellen und Zaehler.
   ============================================================ */

:root {
  --paper:      #f4f5f1;
  --surface:    #ffffff;
  --surface-2:  #e8ebe4;
  --ink:        #14201a;
  --ink-2:      #5a665e;
  --rule:       #d3d8cd;

  --river:      #1c5f72;
  --river-bg:   #e2edf0;
  --fireweed:   #a82463;
  --fireweed-2: #8d1b52;
  --spruce:     #2c6141;
  --spruce-bg:  #e3eee6;
  --rust:       #9c3520;
  --rust-bg:    #f6e6e2;
  --blaze:      #e8611c;

  --r:   8px;
  --tap: 48px;

  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:    "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono:    "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121714; --surface: #1a211c; --surface-2: #232b25;
    --ink: #e6eae3; --ink-2: #97a199; --rule: #2e382f;
    --river: #7fbbd0; --river-bg: #14303a;
    --fireweed: #e06a9e; --fireweed-2: #ee87b3;
    --spruce: #72c08e; --spruce-bg: #16301f;
    --rust: #e68a76; --rust-bg: #351a18;
    --blaze: #ff8a45;
  }
}
:root[data-theme="dark"] {
  --paper: #121714; --surface: #1a211c; --surface-2: #232b25;
  --ink: #e6eae3; --ink-2: #97a199; --rule: #2e382f;
  --river: #7fbbd0; --river-bg: #14303a;
  --fireweed: #e06a9e; --fireweed-2: #ee87b3;
  --spruce: #72c08e; --spruce-bg: #16301f;
  --rust: #e68a76; --rust-bg: #351a18;
  --blaze: #ff8a45;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 17px/1.55 var(--body);
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--fireweed); outline-offset: 2px; border-radius: 4px; }

/* ---------- Hilfsklasse: Mono-Auszeichnung ---------- */

.mono, .src, .eyebrow, .thr-label {
  font: 500 11px/1.4 var(--mono);
  letter-spacing: .09em;
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
}

/* ---------- Geruest ---------- */

.app { max-width: 680px; margin: 0 auto; padding: 0 18px calc(80px + env(safe-area-inset-bottom)); }

header.top {
  position: sticky; top: 0; z-index: 20;
  background: var(--paper);
  padding: 16px 0 0;
}
header.top .mast {
  display: flex; align-items: baseline; gap: 10px;
  font: 700 20px/1 var(--display);
  text-transform: uppercase; letter-spacing: .02em;
}
header.top .mast .tag {
  font: 500 10px/1 var(--mono); letter-spacing: .12em;
  color: var(--fireweed); border: 1px solid currentColor;
  padding: 4px 6px; border-radius: 3px; margin-left: auto;
}
header.top .status { padding: 7px 0 8px; }
header.top .rules { border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); height: 3px; }

.view { display: none; padding-top: 22px; }
.view.active { display: block; }

h2 {
  font: 700 25px/1.15 var(--display);
  text-transform: uppercase; letter-spacing: .01em;
  margin: 0 0 14px;
}
h3 {
  font: 700 15px/1.2 var(--display);
  text-transform: uppercase; letter-spacing: .05em;
  color: var(--ink-2);
  margin: 26px 0 8px; padding-bottom: 6px;
  border-bottom: 1px solid var(--rule);
}
p { margin: 0 0 13px; }

/* ---------- Englisch. Ueberall identisch ausgezeichnet. ---------- */

.en {
  position: relative;
  color: var(--river);
  background: var(--river-bg);
  border-left: 3px solid var(--river);
  padding: 13px 42px 13px 14px;
  border-radius: 0 var(--r) var(--r) 0;
  margin: 0 0 13px;
  font-weight: 500;
}
.en::after {
  content: "EN";
  position: absolute; top: 9px; right: 11px;
  font: 500 10px/1 var(--mono); letter-spacing: .1em;
  color: var(--river); opacity: .55;
}
.en-inline {
  color: var(--river); font-weight: 600;
  background: var(--river-bg); padding: 1px 5px; border-radius: 4px;
}

/* ---------- Karten ---------- */

.card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r);
  padding: 16px;
  margin: 0 0 13px;
}
.src { margin-top: 10px; }

figure { margin: 16px 0; }
figure img { width: 100%; height: auto; border-radius: var(--r); background: var(--surface-2); }
figcaption { margin-top: 7px; font-size: 14px; color: var(--ink-2); }

/* ---------- Bedienelemente ---------- */

button {
  font: 500 16px/1.4 var(--body); color: inherit;
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: var(--r); padding: 13px 15px; min-height: var(--tap);
  cursor: pointer; text-align: left; width: 100%;
  transition: border-color .12s, background .12s;
}
button:hover { border-color: var(--ink-2); }
.btn-row { display: flex; gap: 9px; margin-top: 14px; }
.btn-row button { text-align: center; }

button.primary {
  background: var(--fireweed); border-color: var(--fireweed); color: #fff;
  font-weight: 600; letter-spacing: .01em;
}
button.primary:hover { background: var(--fireweed-2); border-color: var(--fireweed-2); }
button.primary:disabled { opacity: .4; cursor: default; }
button.ghost { background: transparent; }
button.small { min-height: 38px; padding: 8px 12px; font-size: 14px; width: auto; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
.chips button {
  width: auto; min-height: 38px; padding: 8px 14px;
  font: 500 14px/1 var(--body); border-radius: 999px;
}
.chips button[aria-pressed="true"] {
  background: var(--fireweed); border-color: var(--fireweed); color: #fff;
}
.chips button .n { font: 500 12px/1 var(--mono); opacity: .7; margin-left: 5px; }

/* ---------- Fortschritt (nicht Punktzahl) ---------- */

.progress { height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--fireweed); transition: width .3s; }

/* ---------- Signatur: die 80-Prozent-Linie ---------- */

.score { margin: 4px 0 18px; }
.score-num {
  font: 700 64px/1 var(--display);
  letter-spacing: -.02em; font-variant-numeric: tabular-nums;
}
.score-num span { font-size: 26px; margin-left: 4px; }
.score-num.pass { color: var(--spruce); }
.score-num.fail { color: var(--rust); }

.meter-wrap { position: relative; padding-bottom: 26px; margin-top: 14px; }
.meter {
  position: relative; height: 14px;
  background: var(--surface-2); border: 1px solid var(--rule);
  border-radius: 3px; overflow: hidden;
}
.meter > i {
  display: block; height: 100%;
  width: calc(var(--v, 0) * 1%);
  background: var(--rust);
  transition: width .55s cubic-bezier(.2, .8, .3, 1);
}
.meter.pass > i { background: var(--spruce); }
/* die Linie selbst, das einzige Blaze im ganzen Entwurf */
.meter::after {
  content: ""; position: absolute; left: 80%; top: -1px; bottom: -1px;
  width: 2px; background: var(--blaze);
}
.thr-label {
  position: absolute; left: 80%; top: 100%; transform: translateX(-100%);
  margin-top: 6px; padding-right: 6px; white-space: nowrap; color: var(--blaze);
}
@media (prefers-reduced-motion: reduce) {
  .meter > i, .progress > i { transition: none; }
}

/* ---------- Quiz ---------- */

.opt { margin-bottom: 9px; display: block; }
.opt .opt-en { display: block; font-weight: 500; color: var(--river); }
.opt .opt-de { display: block; margin-top: 4px; font-size: 14px; color: var(--ink-2); }
.opt.correct { background: var(--spruce-bg); border-color: var(--spruce); }
.opt.wrong   { background: var(--rust-bg);   border-color: var(--rust); }
.opt:disabled { cursor: default; }
.opt:disabled:hover { border-color: var(--rule); }
.opt.correct:disabled:hover { border-color: var(--spruce); }
.opt.wrong:disabled:hover   { border-color: var(--rust); }

.why { border-radius: var(--r); padding: 14px; margin-top: 14px; font-size: 15px; }
.why.ok { background: var(--spruce-bg); border: 1px solid var(--spruce); }
.why.no { background: var(--rust-bg);   border: 1px solid var(--rust); }
.why b { font-family: var(--display); text-transform: uppercase; letter-spacing: .04em; }
.why.ok b { color: var(--spruce); }
.why.no b { color: var(--rust); }

.runs { display: flex; flex-direction: column; gap: 9px; }
.run {
  display: flex; align-items: baseline; gap: 10px;
  padding: 11px 0; border-bottom: 1px solid var(--rule);
}
.run .pct { font: 700 20px/1 var(--display); font-variant-numeric: tabular-nums; min-width: 58px; }
.run .pct.pass { color: var(--spruce); }
.run .pct.fail { color: var(--rust); }

/* ---------- Vokabelkarte ---------- */

.flash { text-align: center; padding: 40px 20px; }
.flash .term {
  font: 700 32px/1.15 var(--display);
  color: var(--river); letter-spacing: -.01em;
}
.flash .de { font-size: 22px; margin-top: 16px; font-weight: 500; }
.flash .expl { font-size: 15px; color: var(--ink-2); margin-top: 10px; }
.flash .src { margin-top: 14px; }

.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 16px; }
.grade button { text-align: center; font-size: 15px; }
.grade button[data-g="0"]:hover { border-color: var(--rust); color: var(--rust); }
.grade button[data-g="2"]:hover { border-color: var(--spruce); color: var(--spruce); }

/* ---------- Listen ---------- */

.vlist { list-style: none; padding: 0; margin: 0; }
.vlist li {
  border-bottom: 1px solid var(--rule); padding: 13px 0;
  display: flex; gap: 12px; align-items: flex-start;
}
.vlist .v-en { color: var(--river); font-weight: 600; }
.vlist .v-de { color: var(--ink); font-size: 15px; }
.vlist .v-x  { display: block; margin-top: 3px; font-size: 13px; color: var(--ink-2); line-height: 1.45; }

.speak {
  flex: 0 0 auto; width: 34px; height: 34px; min-height: 34px; padding: 0;
  display: grid; place-items: center; border: 0; background: transparent;
  border-radius: 6px; color: var(--river); opacity: .65;
}
.speak:hover { opacity: 1; background: var(--river-bg); }

/* Modusumschalter. Bewusst nicht Fireweed, sonst konkurriert er mit den Filtern. */
.seg {
  display: inline-flex; margin: 0 0 18px;
  border: 1px solid var(--rule); border-radius: 999px;
  overflow: hidden; background: var(--surface);
}
.seg button {
  width: auto; border: 0; border-radius: 0; min-height: 36px;
  padding: 8px 20px; font: 500 14px/1 var(--body); color: var(--ink-2);
}
.seg button:hover { background: var(--surface-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.speak svg { width: 17px; height: 17px; }

.empty { color: var(--ink-2); font-size: 15px; padding: 30px 0; text-align: center; }
.note {
  background: var(--surface-2); border-left: 3px solid var(--rule);
  padding: 12px 14px; font-size: 14px; color: var(--ink-2); margin: 0 0 18px;
  border-radius: 0 var(--r) var(--r) 0;
}

/* ---------- Tableiste ---------- */

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; background: var(--surface);
  border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs button {
  flex: 1; border: 0; background: none; border-radius: 0;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 4px 9px; min-height: 60px;
  font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-2);
}
nav.tabs button:hover { border-color: transparent; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-selected="true"] { color: var(--fireweed); }

button.small svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 6px; }
</style>
</head>

 die im Magazin."},{"type":"en","text":"Observe the chamber."},{"type":"de","text":"O wie Observe. Sieh in das Patronenlager hinein, also dorthin, wo die Patrone beim Schuss liegt. Sieh wirklich hin, taste nicht."},{"type":"en","text":"Verify the feeding path."},{"type":"de","text":"V wie Verify. Der feeding path ist der Zuführweg, also der Weg, auf dem eine Patrone vom Magazin ins Patronenlager gelangt. Auch der muss leer sein."},{"type":"en","text":"Examine the bore for obstructions."},{"type":"de","text":"E wie Examine. Der bore ist das Innere des Laufs. Prüfe, ob etwas darin steckt, mit dem Auge oder mit einem Stab. Ein verstopfter Lauf kann beim Schuss bersten."},{"type":"en","text":"The firearm is now unloaded and safe until it leaves the direct control of the person who unloaded and PROVEd it safe."},{"type":"de","text":"Wichtiger Nachsatz: Die Waffe gilt nur so lange als sicher, wie sie in der direkten Kontrolle derjenigen Person bleibt, die sie entladen und geprüft hat. Gibst du sie aus der Hand und bekommst sie zurück, fängst du wieder bei P an."},{"type":"img","src":"data:image/webp;base64,UklGRgZwAABXRUJQVlA4IPpvAACQTwKdASroA8IDPmEuk0ekIiIhIVOKoIAMCWlu/ApXEpFxXNGd9DRkpS/A/6B/af65+uX7g/M/4t+h/1j+5/4r/H/1//v+vP4h8w/Yf7f/k/85/b/+7/v/kS/i/Fb6p/Vf7T0Q/jP2S/Cf2n/J/7D/Fft98ff5b+1ftR/iv2L9q/y/9m/03+A/cb/FfIL+MfyD+4/1r/If67+9ftZ9jX0n+c/xneZ6r/tf9h6gvrF9C/0P+A/df/Mfun7Pn9b/fv3c93vsD/qP7p+8/9o+wL+b/07/Uf3L/Gf9j/Af///tfFD/y/Gu/K/7T/i/8D4Av5v/bv+5/iP9n+8/0t/0v/b/0H+g/+P+691v5b/mf+//nf9T+z/2F/yz+u/8H/B/6v/zf6H/////75f//7sv2t///u2ftR///+4L5EmWz9yW/oAlN0U9V2P8qziqK56w3dkKw39AEpuinquyFYb+gCU3RT1XZCsN/QBKbop6rsf5VpZvt8VcvpaVeRT3Jb+gCU3RTw/I//veQsN3ZCsN/QBKbop6rshWG/oAlN0U9V2QrDf0ASm6Keq6oyeiPXh9qmbQN+WPf13+FsGAgsaBvyx7+vNq80Dflj39ebV5oFuCULALGgb7GbxwFKWbJiCHZ7zfrjavNq80Dflj39ebV5oG/LHv682fN5H3OCZyvAFmJsxR3j+9Dwn7XXh9SSrouujzUekhecrY4JTqOposaBvyx7+vNq80Dflj39ebV5nx2M1BZouSlM3NcFS+Z9o4Q5+jR4MWhbpVFuMGQwDEkzoVUNHEXQpvtZuzmM+MGue4JsRPvTY8z7UDWGonoKmKMtMhGJ5f3Q3B5SdeZwMLgVNz7H ,"text":"All firearm owners need a valid firearm licence."},{"type":"en","text":"If you are the holder of a valid Firearms Licence, you must inform the Canadian Firearms Program within 30 days, when you change your address."},{"type":"de","text":"Merke die Zahl: 30 Tage nach einem Umzug. Solche Fristen sind typische Prüfungsfragen."},{"type":"de","text":"Es gibt zwei Erlaubnisarten. Die PAL erlaubt Erwerb und Besitz, die POL nur den Besitz. Mit einer PAL darfst du Waffen derselben Klasse leihen, kaufen, erben oder auf andere Weise erwerben. Mit einer POL darfst du nur leihen."},{"type":"de","text":"Die Provinz oder das Territorium regelt vor allem die Jagd. Im Yukon gilt Territorialrecht. Manche Gebiete verlangen zum Beispiel Signalorange beim Jagen oder verbieten das Schießen in einem bestimmten Abstand zu Straßen und Wohnhäusern."},{"type":"de","text":"Die Gemeinde regelt Örtliches. Manche verbieten jeden Schuss im Gemeindegebiet, andere regeln Uhrzeiten oder Abstände zu Wohnhäusern."},{"type":"de","text":"Zwei Straftatbestände nennt das Handbuch ausdrücklich. Beide solltest du kennen."},{"type":"en","text":"Every person commits an offence who, without lawful excuse, points a firearm at another person, whether the firearm is loaded or unloaded."},{"type":"de","text":"Mit einer Waffe auf einen Menschen zu zielen ist strafbar, und zwar unabhängig davon, ob sie geladen ist. Bis zu fünf Jahre Haft, oder im abgekürzten Verfahren 5.000 Dollar Geldstrafe und bis zu sechs Monate."},{"type":"en","text":"Every person who stores, displays, transports or handles any firearm in a manner contrary to the Storage, Display, Transportation and Handling of Firearms by Individuals Regulations is guilty of an offence."},{"type":"de","text":"Falsches Lagern, Ausstellen, Transportieren oder Handhaben ist ebenfalls strafbar. Beim ersten Mal bis zu zwei Jahre, im Wiederholungsfall bis zu fünf."},{"type":"terms","ids":["firearm-licence","pal","pol","non-restricted","indictable-offence","summary-conviction","blaze-orange","dwelling","canadian-firearms-program"]}]}]},{"id":"modul4","titleDe":"Modul 4: Grundlegende Waffensicherheit","titleEn":"Module 4: Basic Firearm Safety","units":[{"id":"m4-praxis","titleDe":"Umgang mit Waffe und Munition","titleEn":"Firearms and ammunition safety practices","source":"S. 59","blocks":[{"type":"de","text":"Das Gesetz gibt eine Untergrenze vor. Erfahrene Nutzer gehen darüber hinaus. Die folgenden Punkte sind solche empfohlenen Praktiken, und sie kommen in Prüfungsfragen vor."},{"type":"en","text":"All firearms and ammunition under your control are your responsibility 24 hours a day."},{"type":"de","text":"Rund um die Uhr verantwortlich, ohne Ausnahme. Achte auf die Formulierung 24 hours a day, das ist so eine Stelle, an der eine True-False-Frage hängt."},{"type":"en","text":"Firearms are safer when stored and transported under lock and key."},{"type":"de","text":"Unter Verschluss lagern und transportieren. Beispiele nennt das Handbuch selbst: Abzugsschlösser, Kabelschlösser und sicher verschlossene Behälter."},{"type":"en","text":"Keep firearms and ammunition out of sight during transport and storage."},{"type":"de","text":"Außer Sichtweite halten. Das senkt die Diebstahlgefahr und verhindert, dass Unbefugte an die Waffe kommen."},{"type":"en","text":"Ammunition and firearms must be kept away from unsupervised children."},{"type":"de","text":"Von unbeaufsichtigten Kindern fernhalten. Unerlaubte Lagerung ist eine Straftat."},{"type":"en","text":"Store firearms unloaded. Lock the firearm and the ammunition separately when storing them or lock them in a secure container, receptacle or room that cannot be easily broken into."},{"type":"de","text":"Entladen lagern. Waffe und Munition getrennt abschließen, oder beides zusammen in einem Behälter oder Raum, in den man nicht leicht einbrechen kann."},{"type":"terms","ids":["ammunition","secure-locking-device","trigger-lock","cable-lock","locked-container","storage"]}]},{"id":"m4-laden","titleDe":"Nur zum tatsächlichen Gebrauch laden","titleEn":"Load a firearm only for actual use","source":"S. 59 und S. 60","blocks":[{"type":"de","text":"Die Grundregel lautet: geladen wird nur dann, wenn du gleich schießen willst und dort, wo das sicher und erlaubt ist. Zu jeder anderen Zeit ist die Waffe entladen."},{"type":"en","text":"At the firing range, load a firearm only when you have reached the shooting area and you are ready to shoot. Completely unload the firearm before you leave the shooting area."},{"type":"de","text":"Auf dem Schießstand: erst laden, wenn du am Stand stehst und schießbereit bist. Vollständig entladen, bevor du den Stand verlässt."},{"type":"en","text":"Always make sure a firearm is unloaded before you pass it to anyone or anytime it leaves your hands. Whenever possible, leave the action open."},{"type":"de","text":"Vor jeder Weitergabe entladen, und wenn möglich den Verschluss offen lassen. Die action ist der Verschluss, also der bewegliche Teil, der die Patrone zuführt und das Patronenlager verschließt. Offen bedeutet: jeder sieht sofort, dass nichts drin ist."},{"type":"en","text":"Never accept a loaded firearm from anyone."},{"type":"de","text":"Nimm nie eine geladene Waffe an. Auch nicht von einem Freund, auch nicht, wenn er sagt, sie sei sicher. Das ist eine der Review-Fragen des Handbuchs."},{"type":"en","text":"Never run with a loaded firearm. Never climb or cross an obstacle with a loaded firearm. Never jump a ditch with a loaded firearm."},{"type":"de","text":"Nicht rennen, nicht klettern, nicht über Hindernisse oder Gräben steigen, solange die Waffe geladen ist."},{"type":"en","text":"Do not lean loaded firearms against a vehicle, tree or wall. They could fall over and discharge."},{"type":"de","text":"Geladene Waffen nicht anlehnen. Sie können umfallen und sich dabei entladen, also einen Schuss auslösen."},{"type":"en","text":"Transport only unloaded firearms by vehicle or boat."},{"type":"de","text":"Im Fahrzeug und im Boot nur entladen transportieren. Die Bewegung kann dich stolpern lassen oder die Waffe fallen lassen, und geladen löst sich dann womöglich ein Schuss."},{"type":"terms","ids":["action","discharge","unintentional-discharge","firing-range"]}]},{"id":"m4-schuss","titleDe":"Sicher sein, bevor du schießt","titleEn":"Be sure before you shoot","source":"S. 60 und S. 61","blocks":[{"type":"de","text":"Dieser Abschnitt liefert besonders viele Prüfungsfragen, weil er klare Ja-Nein-Regeln enthält."},{"type":"en","text":"Always examine the bore for obstructions before loading."},{"type":"de","text":"Vor dem Laden immer den Lauf auf Verstopfungen prüfen."},{"type":"en","text":"Always check that you are using the right ammunition. Use only the ammunition for which the firearm was designed. Carry only the type of ammunition you intend to shoot."},{"type":"de","text":"Nur die Munition verwenden, für die die Waffe gebaut ist. Und nur die Sorte mitnehmen, die du auch verschießen willst. Deshalb ist es falsch, wenn drei Leute mit unterschiedlichen Kalibern ihre Munition zusammen auf das Armaturenbrett legen. Auch das ist eine Review-Frage des Handbuchs."},{"type":"en","text":"Never rely on the firearm's safety. Safeties wear down and may not work properly. A loaded firearm may fire even with the safety on. All mechanical devices can fail."},{"type":"de","text":"Verlass dich nie auf die Sicherung. Die safety ist die mechanische Sicherung an der Waffe. Sie nutzt sich ab und kann versagen. Eine geladene Waffe kann auch mit eingelegter Sicherung losgehen."},{"type":"de","text":"Beim Ziel gilt: erst sicher identifizieren, dann schießen."},{"type":"en","text":"Positively identify your target. Do not shoot when in doubt. Never fire at a movement, a colour, a sound or a shape."},{"type":"de","text":"Niemals auf eine Bewegung, eine Farbe, ein Geräusch oder einen Umriss schießen. Im Zweifel nicht schießen."},{"type":"en","text":"Never use a scope as a substitute for binoculars to identify persons, animals or objects."},{"type":"de","text":"Das Zielfernrohr ist kein Fernglas. Wer damit die Landschaft absucht, richtet die Mündung auf alles, was er anschaut. Auch das ist eine Review-Frage."},{"type":"de","text":"Und du musst wissen, wo dein Geschoss landen kann, auch hinter dem Ziel. Vier Situationen nennt das Handbuch als gefährlichen Hintergrund."},{"type":"en","text":"Never shoot if your bullet may hit a hard surface or water. Never shoot at a target near a building. Never shoot at a target on top of a hill. Only shoot when you are sure no one is ahead of you."},{"type":"de","text":"Harte Oberfläche oder Wasser, weil das Geschoss als Querschläger abprallen kann. Nahe an einem Gebäude. Ein Ziel auf einer Hügelkuppe, weil dahinter der Himmel ist und du nicht siehst, was dahinter liegt. Und niemand vor dir. Diese vier sind die Antwort auf die erste Review-Frage von Modul 4."},{"type":"terms","ids":["safety","target","background","ricochet","scope","binoculars","field-of-fire","calibre"]}]},{"id":"m4-schloss","titleDe":"Sichere Verschlusseinrichtungen","titleEn":"Secure locking devices","source":"S. 61","blocks":[{"type":"de","text":"Eine secure locking device ist eine Vorrichtung, die das Abfeuern der Waffe verhindert. Sie wirkt nur, wenn sie richtig angebracht ist, und nicht jede passt an jede Waffe."},{"type":"en","text":"Secure locking devices prevent a firearm from being fired. To work effectively, they must be installed properly."},{"type":"de","text":"Die häufigsten Bauarten nennt das Handbuch: Abzugsschlösser mit Schlüssel oder Zahlenkombination, sowie Ketten- und Kabelschlösser. Alle blockieren die Bedienung."},{"type":"en","text":"In some cases, they are required by law."},{"type":"de","text":"In bestimmten Fällen sind sie gesetzlich vorgeschrieben. Welche das genau sind, steht in Modul 11 über Lagerung und Transport."},{"type":"img","src":"data:image/webp;base64,UklGRhYqAABXRUJQVlA4IAoqAACwqACdASr0AV4BPmEsk0ekIiGhIxQqaIAMCWlu4XHOO2v6BvTyfjD+ .","de":"In die sicherste verfügbare Richtung.","correct":true,"whyDe":"Das Handbuch schreibt safest available, also die sicherste verfügbare. Genau dieses Wort wird geprüft."},{"en":"In any direction that is not towards a person.","de":"In jede Richtung, die nicht auf eine Person zeigt.","correct":false,"whyDe":"Zu wenig. Verlangt ist die sicherste verfügbare Richtung, nicht irgendeine."},{"en":"Towards the ground at all times.","de":"Jederzeit zum Boden.","correct":false,"whyDe":"Der Boden ist nicht immer die sicherste Richtung, zum Beispiel wegen Abprallern."},{"en":"Towards the target only.","de":"Nur auf das Ziel.","correct":false,"whyDe":"Gilt nicht beim Tragen, Weitergeben oder Prüfen."}]},{"id":"q-acts-03","type":"tf","unit":"intro-acts","source":"S. 21","tags":["acts"],"stemEn":"The trigger finger must be kept off the trigger and out of the trigger guard as soon as you pick up a firearm.","stemDe":"Der Abzugsfinger bleibt vom Abzug und aus dem Abzugsbügel weg, sobald du die Waffe aufnimmst.","answer":true,"whyDe":"Richtig. Das Handbuch nennt ausdrücklich den Moment des Aufnehmens, nicht erst das Halten."},{"id":"q-acts-04","type":"mc","unit":"intro-acts","source":"S. 21","tags":["acts","prove"],"stemEn":"To see that a firearm is unloaded, which parts must you check?","stemDe":"Was musst du prüfen, um sicher zu sein, dass die Waffe entladen ist?","options":[{"en":"Both the chamber and the magazine.","de":"Patronenlager und Magazin, beide.","correct":true,"whyDe":"Das Handbuch nennt beide ausdrücklich. Nur eines von beiden reicht nicht."},{"en":"The chamber only.","de":"Nur das Patronenlager.","correct":false,"whyDe":"Zu wenig. Im Magazin kann weiter Munition sein."},{"en":"The magazine only.","de":"Nur das Magazin.","correct":false,"whyDe":"Zu wenig. Im Patronenlager kann weiter eine Patrone liegen."},{"en":"The bore only.","de":"Nur den Lauf.","correct":false,"whyDe":"Der Lauf wird auf Verstopfungen geprüft, das ist eine andere Frage."}]},{"id":"q-acts-05","type":"tf","unit":"intro-acts","source":"S. 21","tags":["acts"],"stemEn":"A firearm may be passed to another person while the action is closed, as long as it is unloaded.","stemDe":"Eine Waffe darf mit geschlossenem Verschluss weitergegeben werden, solange sie entladen ist.","answer":false,"whyDe":"Falsch. Das Handbuch verlangt: pass or accept only open and unloaded firearms. Offen und entladen, beides."},{"id":"q-prove-01","type":"mc","unit":"intro-prove","source":"S. 22","tags":["prove"],"stemEn":"What is the first step of PROVE?","stemDe":"Was ist der erste Schritt von PROVE?","options":[{"en":"Point the firearm in the safest available direction.","de":"Richte die Waffe in die sicherste verfügbare Richtung.","correct":true,"whyDe":"P wie Point. Die Richtung kommt vor allem anderen."},{"en":"Remove all ammunition.","de":"Entferne die gesamte Munition.","correct":false,"whyDe":"Das ist R, der zweite Schritt."},{"en":"Observe the chamber.","de":"Sieh in das Patronenlager.","correct":false,"whyDe":"Das ist O, der dritte Schritt."},{"en":"Examine the bore for obstructions.","de":"Untersuche den Lauf auf Verstopfungen.","correct":false,"whyDe":"Das ist E, der letzte Schritt."}]},{"id":"q-prove-02","type":"mc","unit":"intro-prove","source":"S. 22","tags":["prove"],"stemEn":"In PROVE, the letter V stands for which step?","stemDe":"Welcher Schritt steckt hinter dem V in PROVE?","options":[{"en":"Verify the feeding path.","de":"Prüfe den Zuführweg.","correct":true,"whyDe":"V wie Verify. Der Zuführweg ist der Weg vom Magazin ins Patronenlager."},{"en":"Verify the safety is on.","de":"Prüfe, ob die Sicherung eingelegt ist.","correct":false,"whyDe":"Auf die Sicherung darf man sich nie verlassen, sie ist kein Schritt in PROVE."},{"en":"View the muzzle.","de":"Sieh auf die Mündung.","correct":false,"whyDe":"Kommt in PROVE nicht vor, und in den Lauf sieht man von der anderen Seite."},{"en":"Verify the licence.","de":"Prüfe die Erlaubnis.","correct":false,"whyDe":"PROVE beschreibt Handgriffe an der Waffe, nichts Rechtliches."}]},{"id":"q-prove-03","type":"mc","unit":"intro-prove","source":"S. 22","tags":["prove"],"stemEn":"Which of the following is the correct order of the PROVE steps?","stemDe":"Welche Reihenfolge der PROVE-Schritte ist richtig?","options":[{"en":"Point, Remove, Observe, Verify, Examine","de":"Point, Remove, Observe, Verify, Examine","correct":true,"whyDe":"So steht es im Handbuch. Die Reihenfolge ist Teil der Prüfung."},{"en":"Point, Observe, Remove, Verify, Examine","de":"Point, Observe, Remove, Verify, Examine","correct":false,"whyDe":"Remove kommt vor Observe. Erst die Munition raus, dann hineinsehen."},{"en":"Remove, Point, Observe, Examine, Verify","de":"Remove, Point, Observe, Examine, Verify","correct":false,"whyDe":"Point steht immer am Anfang, und Examine am Ende."},{"en":"Point, Remove, Verify, Observe, Examine","de":"Point, Remove, Verify, Observe, Examine","correct":false,"whyDe":"Observe kommt vor Verify. Erst das Patronenlager, dann der Zuführweg."}]},{"id":"q-prove-04","type":"tf","unit":"intro-prove","source":"S. 22","tags":["prove"],"stemEn":"Once a firearm has been PROVEd safe, it remains safe even after it leaves the direct control of the person who PROVEd it.","stemDe":"Eine einmal geprüfte Waffe bleibt sicher, auch wenn sie die direkte Kontrolle der prüfenden Person verlässt.","answer":false,"whyDe":"Falsch. Die Waffe gilt nur so lange als sicher, wie sie in der direkten Kontrolle der Person bleibt, die sie entladen und geprüft hat. Danach beginnt PROVE wieder von vorn."},{"id":"q-prove-05","type":"mc","unit":"intro-prove","source":"S. 22","tags":["prove"],"stemEn":"Why must the bore be examined?","stemDe":"Warum muss der Lauf untersucht werden?","options":[{"en":"To check for obstructions.","de":"Um auf Verstopfungen zu prüfen.","correct":true,"whyDe":"Ein Fremdkörper im Lauf kann beim Schuss dazu führen, dass der Lauf birst."},{"en":"To check that the safety works.","de":"Um zu prüfen, ob die Sicherung funktioniert.","correct":false,"whyDe":"Auf die Sicherung darf man sich ohnehin nie verlassen."},{"en":"To check the calibre.","de":"Um das Kaliber zu prüfen.","correct":false,"whyDe":"Das Kaliber steht an der Waffe, nicht im Lauf."},{"en":"To check for rust only.","de":"Nur um auf Rost zu prüfen.","correct":false,"whyDe":"Zu eng. Es geht um jede Verstopfung."}]},{"id":"q-recht-01","type":"mc","unit":"intro-recht","source":"S. 23","tags":["recht"],"stemEn":"Within how many days must a licence holder inform the Canadian Firearms Program of a change of address?","stemDe":"Innerhalb wie vieler Tage muss ein Erlaubnisinhaber einen Umzug melden?","options":[{"en":"Within 30 days.","de":"Innerhalb von 30 Tagen.","correct":true,"whyDe":"30 Tage. Solche Fristen sind typische Prüfungsfragen."},{"en":"Within 7 days.","de":"Innerhalb von 7 Tagen.","correct":false,"whyDe":"Zu kurz, das Handbuch nennt 30 Tage."},{"en":"Within 60 days.","de":"Innerhalb von 60 Tagen.","correct":false,"whyDe":"Zu lang, das Handbuch nennt 30 Tage."},{"en":"There is no time limit.","de":"Es gibt keine Frist.","correct":false,"whyDe":"Es gibt eine Frist, und zwar 30 Tage."}]},{"id":"q-recht-02","type":"mc","unit":"intro-recht","source":"S. 23","tags":["recht","pal"],"stemEn":"Which licence permits the holder to buy or otherwise acquire a firearm?","stemDe":"Welche Erlaubnis erlaubt den Erwerb einer Waffe?","options":[{"en":"The Possession and Acquisition Licence (PAL).","de":"Die Besitz- und Erwerbserlaubnis (PAL).","correct":true,"whyDe":"Acquisition heißt Erwerb. Mit der PAL darf man leihen, kaufen, erben und erwerben."},{"en":"The Possession Only Licence (POL).","de":"Die reine Besitzerlaubnis (POL).","correct":false,"whyDe":"Possession Only heißt nur Besitz. Damit darf man leihen, aber nicht erwerben."},{"en":"A hunting licence.","de":"Eine Jagderlaubnis.","correct":false,"whyDe":"Die Jagderlaubnis ist etwas anderes und ersetzt keine Waffenerlaubnis."},{"en":"No licence is required.","de":"Es ist keine Erlaubnis nötig.","correct":false,"whyDe":"Jeder Waffenbesitzer braucht eine gültige Erlaubnis."}]},{"id":"q-recht-03","type":"mc","unit":"intro-recht","source":"S. 23","tags":["recht"],"stemEn":"Which level of government would typically require a hunter to wear blaze orange clothing?","stemDe":"Welche staatliche Ebene schreibt typischerweise Signalorange beim Jagen vor?","options":[{"en":"Provincial or territorial.","de":"Provinz oder Territorium.","correct":true,"whyDe":"Jagdrecht liegt bei Provinz und Territorium. Für deinen Onkel also Yukon."},{"en":"Federal.","de":"Der Bund.","correct":false,"whyDe":"Der Bund regelt Erlaubnis und Besitz, nicht die Jagdkleidung."},{"en":"Municipal.","de":"Die Gemeinde.","correct":false,"whyDe":"Die Gemeinde regelt Örtliches wie Schießzeiten und Abstände."},{"en":"None of the above.","de":"Keine der genannten.","correct":false,"whyDe":"Provinz und Territorium regeln das."}]},{"id":"q-recht-04","type":"mc","unit":"intro-recht","source":"S. 23","tags":["recht"],"stemEn":"A municipality may do which of the following?","stemDe":"Was darf eine Gemeinde tun?","options":[{"en":"Prohibit the discharge of a firearm within its boundaries.","de":"Jeden Schuss im Gemeindegebiet verbieten.","correct":true,"whyDe":"Manche Gemeinden verbieten die Schussabgabe vollständig, andere regeln Zeiten und Abstände zu Wohnhäusern."},{"en":"Issue firearm licences.","de":"Waffenerlaubnisse ausstellen.","correct":false,"whyDe":"Das macht der Bund über das Canadian Firearms Program."},{"en":"Change the classification of a firearm.","de":"Die Waffenklasse ändern.","correct":false,"whyDe":"Die Klassifizierung ist Bundessache."},{"en":"Set the minimum age for a licence.","de":"Das Mindestalter festlegen.","correct":false,"whyDe":"Auch das ist Bundessache."}]},{"id":"q-recht-05","type":"tf","unit":"intro-recht","source":"S. 24","tags":["recht"],"stemEn":"Pointing a firearm at another person is only an offence if the firearm is loaded.","stemDe":"Mit einer Waffe auf eine Person zu zielen ist nur strafbar, wenn sie geladen ist.","answer":false,"whyDe":"Falsch. Das Handbuch sagt ausdrücklich whether the firearm is loaded or unloaded. Ob geladen oder nicht spielt keine Rolle."},{"id":"q-m4-01","type":"tf","unit":"m4-praxis","source":"S. 59","tags":["lagerung"],"stemEn":"All firearms and ammunition under your control are your responsibility 24 hours a day.","stemDe":"Für alle Waffen und Munition in deiner Obhut bist du rund um die Uhr verantwortlich.","answer":true,"whyDe":"Richtig, und zwar wörtlich so im Handbuch: 24 hours a day."},{"id":"q-m4-02","type":"mc","unit":"m4-praxis","source":"S. 59","tags":["lagerung"],"stemEn":"How should firearms and ammunition be stored?","stemDe":"Wie sollen Waffe und Munition gelagert werden?","options":[{"en":"Firearms unloaded, and firearm and ammunition locked separately or in a secure container that cannot easily be broken into.","de":"Waffe entladen, Waffe und Munition getrennt abgeschlossen oder zusammen in einem Behälter, in den man nicht leicht einbrechen kann.","correct":true,"whyDe":"So steht es im Handbuch. Entladen, und dann getrennt abschließen oder gemeinsam sicher wegschließen."},{"en":"Loaded, so the firearm is ready in an emergency.","de":"Geladen, damit die Waffe im Notfall bereit ist.","correct":false,"whyDe":"Gelagert wird immer entladen."},{"en":"Together in an unlocked cabinet.","de":"Zusammen in einem unverschlossenen Schrank.","correct":false,"whyDe":"Unverschlossen genügt nicht."},{"en":"In plain view so they can be checked easily.","de":"Gut sichtbar, damit man sie leicht kontrollieren kann.","correct":false,"whyDe":"Genau umgekehrt: außer Sichtweite, das senkt die Diebstahlgefahr."}]},{"id":"q-m4-03","type":"mc","unit":"m4-laden","source":"S. 59","tags":["laden"],"stemEn":"When should a firearm be loaded?","stemDe":"Wann soll eine Waffe geladen werden?","options":[{"en":"Only when you intend to use it, where it can be safely and legally discharged.","de":"Nur wenn du sie gleich benutzen willst und dort, wo das sicher und erlaubt ist.","correct":true,"whyDe":"Zu jeder anderen Zeit ist die Waffe entladen."},{"en":"Whenever you are carrying it in the field.","de":"Immer wenn du sie im Gelände trägst.","correct":false,"whyDe":"Tragen allein ist kein Grund zu laden."},{"en":"As soon as you arrive at the firing range.","de":"Sobald du am Schießstand ankommst.","correct":false,"whyDe":"Erst am Schießplatz selbst und schießbereit, nicht schon bei der Ankunft."},{"en":"Whenever the safety is on.","de":"Immer wenn die Sicherung eingelegt ist.","correct":false,"whyDe":"Die Sicherung ist kein Grund zu laden und kein Ersatz für Sicherheit."}]},{"id":"q-m4-04","type":"tf","unit":"m4-laden","source":"S. 59","tags":["laden"],"stemEn":"It is safe to accept a loaded firearm from a friend.","stemDe":"Es ist in Ordnung, eine geladene Waffe von einem Freund anzunehmen.","answer":false,"whyDe":"Falsch. Never accept a loaded firearm from anyone. Das gilt auch für Freunde. Dies ist eine der Review-Fragen von Modul 4."},{"id":"q-m4-05","type":"mc","unit":"m4-laden","source":"S. 59","tags":["laden"],"stemEn":"All of the following are recommended practices EXCEPT:","stemDe":"Alle folgenden sind empfohlene Praktiken, AUSSER:","options":[{"en":"Leaning a loaded firearm against a vehicle while you open the door.","de":"Eine geladene Waffe ans Fahrzeug lehnen, während du die Tür öffnest.","correct":true,"whyDe":"Das ist die Ausnahme, also die gesuchte Antwort. Angelehnte Waffen können umfallen und einen Schuss auslösen."},{"en":"Leaving the action open whenever possible.","de":"Den Verschluss offen lassen, wann immer es geht.","correct":false,"whyDe":"Das ist empfohlen, also nicht die gesuchte Ausnahme."},{"en":"Unloading a firearm before transporting it.","de":"Die Waffe vor dem Transport entladen.","correct":false,"whyDe":"Das ist empfohlen und teils vorgeschrieben."},{"en":"Completely unloading before leaving the shooting area.","de":"Vor dem Verlassen des Schießplatzes vollständig entladen.","correct":false,"whyDe":"Das ist empfohlen."}]},{"id":"q-m4-06","type":"tf","unit":"m4-laden","source":"S. 60","tags":["transport"],"stemEn":"A firearm may be transported in a vehicle while loaded if the trip is short.","stemDe":"Eine Waffe darf im Fahrzeug geladen transportiert werden, wenn die Fahrt kurz ist.","answer":false,"whyDe":"Falsch. Transport only unloaded firearms by vehicle or boat. Die Länge der Fahrt ändert daran nichts."},{"id":"q-m4-07","type":"mc","unit":"m4-schuss","source":"S. 60","tags":["sicherung"],"stemEn":"Can the safety mechanism on a firearm be relied upon?","stemDe":"Kann man sich auf die Sicherung einer Waffe verlassen?","options":[{"en":"No. Safeties can wear down and a loaded firearm may fire even with the safety on.","de":"Nein. Sicherungen nutzen sich ab, und eine geladene Waffe kann auch mit eingelegter Sicherung losgehen.","correct":true,"whyDe":"Never rely on the firearm's safety. Alle mechanischen Vorrichtungen können versagen. Dies ist eine der Review-Fragen von Modul 4."},{"en":"Yes, if the firearm is new.","de":"Ja, wenn die Waffe neu ist.","correct":false,"whyDe":"Auch neue Sicherungen können versagen."},{"en":"Yes, if it was checked before use.","de":"Ja, wenn sie vorher geprüft wurde.","correct":false,"whyDe":"Eine Prüfung ändert nichts daran, dass man sich nicht darauf verlassen darf."},{"en":"Yes, for non-restricted firearms only.","de":"Ja, aber nur bei nicht beschränkten Waffen.","correct":false,"whyDe":"Die Regel gilt für alle Waffen."}]},{"id":"q-m4-08","type":"tf","unit":"m4-schuss","source":"S. 60","tags":["sicherung"],"stemEn":"A loaded firearm may fire even when the safety is on.","stemDe":"Eine geladene Waffe kann auch mit eingelegter Sicherung losgehen.","answer":true,"whyDe":"Richtig, und genau deshalb ist die Sicherung kein Ersatz für die vier ACTS."},{"id":"q-m4-09","type":"tf","unit":"m4-schuss","source":"S. 60","tags":["ziel"],"stemEn":"A scope may be used instead of binoculars to glass the terrain and identify a target.","stemDe":"Ein Zielfernrohr darf statt eines Fernglases benutzt werden, um das Gelände abzusuchen.","answer":false,"whyDe":"Falsch. Never use a scope as a substitute for binoculars. Wer durch das Zielfernrohr sucht, richtet die Mündung auf alles, was er ansieht. Dies ist eine Review-Frage."},{"id":"q-m4-10","type":"mc","unit":"m4-schuss","source":"S. 61","tags":["ziel"],"stemEn":"Which of the following is NOT a dangerous background when shooting?","stemDe":"Welcher Hintergrund ist beim Schießen NICHT gefährlich?","options":[{"en":"A high earth bank directly behind the target.","de":"Ein hoher Erdwall direkt hinter dem Ziel.","correct":true,"whyDe":"Das ist die gesuchte Antwort. Erde fängt das Geschoss auf. Die anderen drei nennt das Handbuch ausdrücklich als gefährlich."},{"en":"Water behind the target.","de":"Wasser hinter dem Ziel.","correct":false,"whyDe":"Gefährlich. Wasser kann einen Abpraller verursachen."},{"en":"A target on top of a hill.","de":"Ein Ziel auf einer Hügelkuppe.","correct":false,"whyDe":"Gefährlich. Dahinter ist offener Himmel, du siehst nicht, was dahinter liegt."},{"en":"A building near the target.","de":"Ein Gebäude in der Nähe des Ziels.","correct":false,"whyDe":"Gefährlich, ausdrücklich im Handbuch genannt."}]},{"id":"q-m4-11","type":"mc","unit":"m4-schuss","source":"S. 60","tags":["ziel"],"stemEn":"You see a movement in the brush while hunting. What should you do?","stemDe":"Du siehst beim Jagen eine Bewegung im Gebüsch. Was tust du?","options":[{"en":"Do not shoot. Positively identify the target first.","de":"Nicht schießen. Zuerst das Ziel zweifelsfrei bestimmen.","correct":true,"whyDe":"Never fire at a movement, a colour, a sound or a shape. Im Zweifel nicht schießen."},{"en":"Shoot if the movement matches the animal you are hunting.","de":"Schießen, wenn die Bewegung zum gejagten Tier passt.","correct":false,"whyDe":"Auf eine Bewegung wird nie geschossen."},{"en":"Fire a warning shot.","de":"Einen Warnschuss abgeben.","correct":false,"whyDe":"Kommt im Handbuch nicht vor und verstößt gegen die Grundregeln."},{"en":"Use the scope to identify it.","de":"Mit dem Zielfernrohr identifizieren.","correct":false,"whyDe":"Das Zielfernrohr ist kein Fernglas."}]},{"id":"q-m4-12","type":"mc","unit":"m4-schuss","source":"S. 60","tags":["munition"],"stemEn":"Three people with rifles of different calibres are travelling together. How should their ammunition be handled?","stemDe":"Drei Leute mit Gewehren unterschiedlichen Kalibers fahren zusammen. Wie mit der Munition umgehen?","options":[{"en":"Each carries only the ammunition for their own firearm, kept out of sight.","de":"Jeder führt nur die Munition für die eigene Waffe mit, außer Sichtweite.","correct":true,"whyDe":"Carry only the type of ammunition you intend to shoot, und Munition gehört außer Sichtweite. Dies ist eine Review-Frage von Modul 4."},{"en":"All ammunition together on the dashboard so it is easy to reach.","de":"Alles zusammen aufs Armaturenbrett, damit man drankommt.","correct":false,"whyDe":"Gleich zwei Fehler: gemischte Kaliber und offen sichtbar."},{"en":"All ammunition in one box, since calibres cannot be confused.","de":"Alles in eine Kiste, Kaliber kann man nicht verwechseln.","correct":false,"whyDe":"Doch, genau deshalb soll man nur die eigene Sorte mitführen."},{"en":"Ammunition may be left loaded in the firearms during transport.","de":"Die Munition darf beim Transport in den Waffen bleiben.","correct":false,"whyDe":"Im Fahrzeug wird nur entladen transportiert."}]},{"id":"q-m4-13","type":"mc","unit":"m4-schloss","source":"S. 61","tags":["lagerung"],"stemEn":"What is the purpose of a secure locking device?","stemDe":"Wozu dient eine sichere Verschlusseinrichtung?","options":[{"en":"It prevents the firearm from being fired.","de":"Sie verhindert, dass die Waffe abgefeuert wird.","correct":true,"whyDe":"Genau das ist ihr Zweck, und sie wirkt nur, wenn sie richtig angebracht ist."},{"en":"It prevents the firearm from being stolen.","de":"Sie verhindert den Diebstahl der Waffe.","correct":false,"whyDe":"Gegen Diebstahl hilft Wegschließen und Außersichtweite, nicht das Schloss selbst."},{"en":"It keeps the barrel free of obstructions.","de":"Sie hält den Lauf frei von Verstopfungen.","correct":false,"whyDe":"Damit hat sie nichts zu tun."},{"en":"It replaces the need for a firearm licence.","de":"Sie ersetzt die Waffenerlaubnis.","correct":false,"whyDe":"Eine Erlaubnis braucht jeder Besitzer, unabhängig davon."}]},{"id":"q-m4-14","type":"tf","unit":"m4-schloss","source":"S. 61","tags":["lagerung"],"stemEn":"Every secure locking device is compatible with every firearm.","stemDe":"Jede Verschlusseinrichtung passt an jede Waffe.","answer":false,"whyDe":"Falsch. Das Handbuch sagt ausdrücklich, dass nicht jede Einrichtung zu jeder Waffe passt. Im Zweifel beim Händler fragen."}]},"vocab":{"_schema":"Vokabeln, Richtung immer Englisch nach Deutsch. cat: fach | pruefung | praxis. verify=true heisst: Wortlaut noch gegen das Handbuch prüfen.","_status":"Pruefungssprache, ACTS und PROVE sowie die Fachbegriffe aus Einfuehrung und Modul 4 sind fertig. Weitere Module folgen.","terms":[{"id":"which-of-the-following","en":"Which of the following ...","de":"Welches der folgenden ...","cat":"pruefung","sub":"Fragegerüst","explDe":"Standardanfang einer Multiple-Choice-Frage. Danach kommt immer eine Liste.","source":"Prüfungssprache"},{"id":"which-of-the-following-is-not","en":"Which of the following is NOT ...","de":"Welches der folgenden ist NICHT ...","cat":"pruefung","sub":"Fragegerüst","explDe":"Verneinung. Gesucht ist die FALSCHE Aussage. Das NOT steht oft in Großbuchstaben. Häufigste Fehlerquelle.","source":"Prüfungssprache"},{"id":"except","en":"... except","de":"... außer","cat":"pruefung","sub":"Fragegerüst","explDe":"Verneinung am Satzende. Gesucht ist die eine Ausnahme, nicht die Regel.","source":"Prüfungssprache"},{"id":"all-of-the-above","en":"All of the above","de":"Alle der genannten","cat":"pruefung","sub":"Fragegerüst","explDe":"Letzte Option. Nur richtig, wenn jede einzelne Option davor stimmt.","source":"Prüfungssprache"},{"id":"none-of-the-above","en":"None of the above","de":"Keine der genannten","cat":"pruefung","sub":"Fragegerüst","explDe":"Nur richtig, wenn keine einzige Option davor stimmt.","source":"Prüfungssprache"},{"id":"select-the-best-answer","en":"Select the best answer","de":"Wähle die beste Antwort","cat":"pruefung","sub":"Fragegerüst","explDe":"Mehrere Optionen können teilweise stimmen. Gesucht ist die vollständigste.","source":"Prüfungssprache"},{"id":"choose-all-that-apply","en":"Choose all that apply","de":"Wähle alles Zutreffende","cat":"pruefung","sub":"Fragegerüst","explDe":"Mehr als eine Antwort ist richtig.","source":"Prüfungssprache"},{"id":"true-or-false","en":"True or False","de":"Wahr oder falsch","cat":"pruefung","sub":"Fragegerüst","explDe":"Der zweite Fragetyp der Prüfung.","source":"Prüfungssprache"},{"id":"what-is-the-purpose-of","en":"What is the purpose of ...","de":"Was ist der Zweck von ...","cat":"pruefung","sub":"Fragegerüst","explDe":"Fragt nach dem Wozu, nicht nach dem Wie.","source":"Prüfungssprache"},{"id":"when-should-you","en":"When should you ...","de":"Wann solltest du ...","cat":"pruefung","sub":"Fragegerüst","explDe":"Fragt nach dem Zeitpunkt.","source":"Prüfungssprache"},{"id":"when-must-you","en":"When must you ...","de":"Wann musst du ...","cat":"pruefung","sub":"Fragegerüst","explDe":"Pflicht, nicht Empfehlung. Unterschied zu should beachten.","source":"Prüfungssprache"},{"id":"who-is-responsible-for","en":"Who is responsible for ...","de":"Wer ist verantwortlich für ...","cat":"pruefung","sub":"Fragegerüst","explDe":"Fragt nach der Person, nicht nach der Handlung.","source":"Prüfungssprache"},{"id":"how-often-must","en":"How often must ...","de":"Wie oft muss ...","cat":"pruefung","sub":"Fragegerüst","explDe":"Fragt nach einer Häufigkeit oder rtation, handling.","source":"S. 25"},{"id":"firearm-licence","en":"firearm licence","de":"Waffenerlaubnis","cat":"fach","sub":"Recht und Erlaubnis","explDe":"Jeder Waffenbesitzer braucht eine gültige.","source":"S. 23"},{"id":"pal","en":"Possession and Acquisition Licence (PAL)","de":"Besitz- und Erwerbserlaubnis","cat":"fach","sub":"Recht und Erlaubnis","explDe":"Erlaubt leihen, kaufen, erben und erwerben. Das ist die, die dein Onkel will.","source":"S. 23"},{"id":"pol","en":"Possession Only Licence (POL)","de":"reine Besitzerlaubnis","cat":"fach","sub":"Recht und Erlaubnis","explDe":"Erlaubt nur leihen und besitzen, nicht erwerben.","source":"S. 23"},{"id":"non-restricted","en":"non-restricted","de":"nicht beschränkt","cat":"fach","sub":"Recht und Erlaubnis","explDe":"Die Waffenklasse, um die es im CFSC geht. Restricted ist ein eigener Kurs.","source":"S. 23"},{"id":"indictable-offence","en":"indictable offence","de":"schwerere Straftat","cat":"fach","sub":"Recht und Erlaubnis","explDe":"Die schwerere der beiden Verfahrensarten, bis zu fünf Jahre Haft.","source":"S. 24"},{"id":"summary-conviction","en":"summary conviction","de":"abgekürztes Verfahren","cat":"fach","sub":"Recht und Erlaubnis","explDe":"Die leichtere Verfahrensart, 5.000 Dollar Geldstrafe und bis zu sechs Monate.","source":"S. 24"},{"id":"blaze-orange","en":"blaze orange","de":"Signalorange","cat":"fach","sub":"Recht und Erlaubnis","explDe":"In manchen Provinzen und Territorien beim Jagen vorgeschrieben.","source":"S. 23"},{"id":"dwelling","en":"dwelling","de":"Wohngebäude","cat":"fach","sub":"Recht und Erlaubnis","explDe":"Taucht in Abstandsregeln auf: nicht in der Nähe von Wohnhäusern schießen.","source":"S. 23"},{"id":"canadian-firearms-program","en":"Canadian Firearms Program (CFP)","de":"kanadisches Waffenprogramm","cat":"fach","sub":"Recht und Erlaubnis","explDe":"Die Stelle, der du innerhalb von 30 Tagen einen Umzug melden musst.","source":"S. 23"}]}};</script>
<script>/* canada-pal-learn. Alles läuft lokal, kein Netz, kein Server. */
(function () {
'use strict';

var SPK = '<svg viewBox="0 0 24 24"><use href="#i-speak"/></svg>';

var C = window.CONTENT || {};
var UNITS = (C.units && C.units.chapters) || [];
var QUESTIONS = (C.questions && C.questions.questions) || [];
var VOCAB = (C.vocab && C.vocab.terms) || [];

/* ---------------- Speicher ---------------- */

var KEY = 'cfsc.v1';
var state = { srs: {}, seen: {}, wrong: {}, quiz: { runs: [] } };

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch (e) { /* privates Fenster, egal */ }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
load();

/* ---------------- Helfer ---------------- */

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function el(id) { return document.getElementById(id); }
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function termById(id) {
  for (var i = 0; i < VOCAB.length; i++) if (VOCAB[i].id === id) return VOCAB[i];
  return null;
}
function speak(text) {
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-CA'; u.rate = 0.85;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------------- Tabs ---------------- */

var VIEWS = ['learn', 'quiz', 'vocab'];
function showTab(name) {
  VIEWS.forEach(function (v) {
    el('view-' + v).classList.toggle('active', v === name);
  });
  document.querySelectorAll('nav.tabs button').forEach(function (b) {
    b.setAttribute('aria-selected', String(b.dataset.tab === name));
  });
  if (name === 'learn') renderLearnIndex();
  if (name === 'quiz') renderQuizStart();
  if (name === 'vocab') renderVocab();
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav.tabs button').forEach(function (b) {
  b.addEventListener('click', function () { showTab(b.dataset.tab); });
});

/* ---------------- Lernen ---------------- */

function renderLearnIndex() {
  el('learn-unit').hidden = true;
  var box = el('learn-index');
  box.hidden = false;

  if (!UNITS.length) {
    box.innerHTML = '<h2>Lernen</h2><p class="empty">Noch keine Inhalte. '
      + 'Sie werden aus dem Handbuch eingefüllt.</p>';
    return;
  }

  var h = '<h2>Lernen</h2>';
  UNITS.forEach(function (ch) {
    h += '<h3>' + esc(ch.titleDe) + '</h3>';
    if (ch.titleEn) h += '<p><span class="en-inline">' + esc(ch.titleEn) + '</span></p>';
    (ch.units || []).forEach(function (u) {
      var done = state.seen[u.id] ? ' ✓' : '';
      h += '<button data-unit="' + esc(u.id) + '">' + esc(u.titleDe) + done
         + '<br><span class="en-inline">' + esc(u.titleEn || '') + '</span></button>';
    });
  });
  box.innerHTML = h;
  box.querySelectorAll('button[data-unit]').forEach(function (b) {
    b.addEventListener('click', function () { renderUnit(b.dataset.unit); });
  });
}

function findUnit(id) {
  for (var i = 0; i < UNITS.length; i++) {
    var us = UNITS[i].units || [];
    for (var j = 0; j < us.length; j++) if (us[j].id === id) return { ch: UNITS[i], u: us[j], ci: i, ui: j };
  }
  return null;
}

function renderUnit(id) {
  var f = findUnit(id);
  if (!f) return;
  var u = f.u;
  state.seen[id] = Date.now(); save();

  el('learn-index').hidden = true;
  var box = el('learn-unit');
  box.hidden = false;

  var h = '<button class="ghost small" id="back">‹ Übersicht</button>';
  h += '<h2>' + esc(u.titleDe) + '</h2>';
  if (u.titleEn) h += '<p><span class="en-inline">' + esc(u.titleEn) + '</span></p>';

  (u.blocks || []).forEach(function (b) {
    if (b.type === 'de') {
      h += '<p>' + esc(b.text) + '</p>';
    } else if (b.type === 'en') {
      h += '<p class="en">' + esc(b.text) + '</p>';
    } else if (b.type === 'img') {
      h += '<figure><img src="' + esc(b.src) + '" alt="' + esc(b.captionDe || '') + '">';
      if (b.captionDe) h += '<figcaption>' + esc(b.captionDe) + '</figcaption>';
      h += '</figure>';
      if (b.labels && b.labels.length) {
        h += '<ul class="vlist">';
        b.labels.forEach(function (l) {
          h += '<li><div><span class="v-en">' + esc(l.en) + '</span><br>'
             + '<span class="v-de">' + esc(l.de) + '</span></div></li>';
        });
        h += '</ul>';
      }
    } else if (b.type === 'terms') {
      h += '<div class="card"><h3>Begriffe</h3><ul class="vlist">';
      (b.ids || []).forEach(function (tid) {
        var t = termById(tid);
        if (!t) return;
        h += '<li><button class="speak small" data-say="' + esc(t.en) + '">' + SPK + '</button>'
           + '<div><span class="v-en">' + esc(t.en) + '</span><br>'
           + '<span class="v-de">' + esc(t.de) + '</span></div></li>';
      });
      h += '</ul></div>';
    }
  });

  if (u.source) h += '<p class="src">Handbuch ' + esc(u.source) + '</p>';

  var nav = nextPrev(f);
  h += '<div class="btn-row">';
  h += nav.prev ? '<button data-go="' + esc(nav.prev) + '">‹ Zurück</button>' : '';
  h += nav.next ? '<button class="primary" data-go="' + esc(nav.next) + '">Weiter ›</button>' : '';
  h += '</div>';

  box.innerHTML = h;
  el('back').addEventListener('click', renderLearnIndex);
  box.querySelectorAll('[data-go]').forEach(function (b) {
    b.addEventListener('click', function () { renderUnit(b.dataset.go); window.scrollTo(0, 0); });
  });
  box.querySelectorAll('[data-say]').forEach(function (b) {
    b.addEventListener('click', function () { speak(b.dataset.say); });
  });
}

function nextPrev(f) {
  var flat = [];
  UNITS.forEach(function (ch) { (ch.units || []).forEach(function (u) { flat.push(u.id); }); });
  var i = flat.indexOf(f.u.id);
  return { prev: i > 0 ? flat[i - 1] : null, next: i >= 0 && i < flat.length - 1 ? flat[i + 1] : null };
}

/* ---------------- Fragen ---------------- */

var ROUND = 20;
var quizScope = 'all';
var session = null;

function scopedQuestions() {
  if (quizScope === 'wrong') {
    return QUESTIONS.filter(function (q) { return state.wrong[q.id]; });
  }
  if (quizScope.indexOf('ch:') === 0) {
    var cid = quizScope.slice(3);
    var ids = {};
    UNITS.forEach(function (ch) {
      if (ch.id !== cid) return;
      (ch.units || []).forEach(function (u) { ids[u.id] = 1; });
    });
    return QUESTIONS.filter(function (q) { return ids[q.unit]; });
  }
  return QUESTIONS.slice();
}

function renderQuizStart() {
  el('quiz-run').hidden = true;
  el('quiz-done').hidden = true;
  el('quiz-start').hidden = false;

  var wrongN = QUESTIONS.filter(function (q) { return state.wrong[q.id]; }).length;
  var chips = [{ k: 'all', l: 'Alles', n: QUESTIONS.length }];
  UNITS.forEach(function (ch) {
    var ids = {}, n = 0;
    (ch.units || []).forEach(function (u) { ids[u.id] = 1; });
    QUESTIONS.forEach(function (q) { if (ids[q.unit]) n++; });
    if (n) chips.push({ k: 'ch:' + ch.id, l: ch.titleDe, n: n });
  });
  if (wrongN) chips.push({ k: 'wrong', l: 'Fehler', n: wrongN });

  el('quiz-scope').innerHTML = chips.map(function (c) {
    return '<button data-k="' + esc(c.k) + '" aria-pressed="' + (quizScope === c.k) + '">'
      + esc(c.l) + '<span class="n">' + c.n + '</span></button>';
  }).join('');
  el('quiz-scope').querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () { quizScope = b.dataset.k; renderQuizStart(); });
  });

  var runs = (state.quiz.runs || []).slice(-6).reverse();
  el('quiz-stats').innerHTML = runs.length
    ? '<h3>Letzte Runden</h3><div class="runs">' + runs.map(function (r) {
        var pct = Math.round(r.correct / r.total * 100);
        return '<div class="run"><span class="pct ' + (pct >= 80 ? 'pass' : 'fail') + '">'
          + pct + '%</span><span class="mono">' + r.correct + ' von ' + r.total + ' richtig</span></div>';
      }).join('') + '</div>'
    : '';

  el('quiz-go').disabled = scopedQuestions().length === 0;
}
el('quiz-go').addEventListener('click', startQuiz);

function normalize(q) {
  if (q.type === 'tf') {
    return {
      q: q,
      stemEn: q.stemEn, stemDe: q.stemDe, source: q.source,
      options: [
        { en: 'True',  de: 'Wahr',   correct: q.answer === true,  whyDe: q.whyDe },
        { en: 'False', de: 'Falsch', correct: q.answer === false, whyDe: q.whyDe }
      ]
    };
  }
  return {
    q: q, stemEn: q.stemEn, stemDe: q.stemDe, source: q.source,
    options: shuffle(q.options || [])
  };
}

function startQuiz() {
  var pool = shuffle(scopedQuestions()).slice(0, ROUND);
  if (!pool.length) return;
  session = { items: pool.map(normalize), i: 0, correct: 0, help: false };
  el('quiz-start').hidden = true;
  el('quiz-done').hidden = true;
  el('quiz-run').hidden = false;
  renderQuestion();
}

function renderQuestion() {
  var s = session, it = s.items[s.i];
  var pct = Math.round(s.i / s.items.length * 100);

  var h = '<div class="progress"><i style="width:' + pct + '%"></i></div>';
  h += '<p class="mono" style="margin:11px 0 15px">Frage ' + (s.i + 1) + ' / ' + s.items.length + '</p>';
  h += '<div class="card"><p class="en">' + esc(it.stemEn) + '</p>';
  if (s.help && it.stemDe) h += '<p class="v-de">' + esc(it.stemDe) + '</p>';
  h += '</div>';

  h += '<div id="opts">';
  it.options.forEach(function (o, i) {
    h += '<button class="opt" data-i="' + i + '">'
       + '<span class="opt-en">' + esc(o.en) + '</span>'
       + (s.help && o.de ? '<span class="opt-de">' + esc(o.de) + '</span>' : '')
       + '</button>';
  });
  h += '</div>';
  h += '<div class="btn-row"><button class="ghost small" id="help">'
     + (s.help ? 'Deutsch ausblenden' : 'Deutsch einblenden') + '</button>'
     + '<button class="ghost small" id="say">' + SPK + ' Vorlesen</button></div>';
  h += '<div id="feedback"></div>';

  el('quiz-run').innerHTML = h;
  el('help').addEventListener('click', function () { s.help = !s.help; renderQuestion(); });
  el('say').addEventListener('click', function () { speak(it.stemEn); });
  el('quiz-run').querySelectorAll('.opt').forEach(function (b) {
    b.addEventListener('click', function () { answer(parseInt(b.dataset.i, 10)); });
  });
}

function answer(idx) {
  var s = session, it = s.items[s.i];
  var picked = it.options[idx];
  var right = !!picked.correct;
  if (right) s.correct++; 
  if (right) delete state.wrong[it.q.id]; else state.wrong[it.q.id] = Date.now();
  save();

  el('quiz-run').querySelectorAll('.opt').forEach(function (b, i) {
    b.disabled = true;
    if (it.options[i].correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });

  var why = picked.whyDe || (it.options.filter(function (o) { return o.correct; })[0] || {}).whyDe || '';
  var h = '<div class="why ' + (right ? 'ok' : 'no') + '">'
        + '<b>' + (right ? 'Richtig' : 'Falsch') + '.</b> ' + esc(why);
  if (it.source) h += '<div class="src">Handbuch ' + esc(it.source) + '</div>';
  h += '</div>';
  h += '<div class="btn-row"><button class="primary" id="next">'
     + (s.i + 1 < s.items.length ? 'Weiter ›' : 'Auswertung ›') + '</button></div>';
  el('feedback').innerHTML = h;
  el('next').addEventListener('click', function () {
    s.i++;
    if (s.i < s.items.length) { renderQuestion(); window.scrollTo(0, 0); }
    else finishQuiz();
  });
}

function finishQuiz() {
  var s = session;
  var pct = Math.round(s.correct / s.items.length * 100);
  var pass = pct >= 80;
  state.quiz.runs = (state.quiz.runs || []).concat([
    { t: Date.now(), correct: s.correct, total: s.items.length, scope: quizScope }
  ]).slice(-30);
  save();

  el('quiz-run').hidden = true;
  var box = el('quiz-done');
  box.hidden = false;
  box.innerHTML = '<p class="eyebrow">Ergebnis</p>'
    + '<div class="score">'
    +   '<div class="score-num ' + (pass ? 'pass' : 'fail') + '">' + pct + '<span>%</span></div>'
    +   '<div class="meter-wrap">'
    +     '<div class="meter' + (pass ? ' pass' : '') + '"><i></i></div>'
    +     '<span class="thr-label">80 % Bestehensgrenze</span>'
    +   '</div>'
    + '</div>'
    + '<p>' + s.correct + ' von ' + s.items.length + ' richtig. '
    + (pass ? 'Das reicht.' : 'Zum Bestehen fehlen dir '
        + (Math.ceil(s.items.length * 0.8) - s.correct) + '.') + '</p>'
    + '<div class="btn-row">'
    +   '<button class="primary" id="again">Neue Runde</button>'
    +   '<button class="ghost" id="back2">Übersicht</button></div>';

  var m = box.querySelector('.meter');
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { m.style.setProperty('--v', pct); });
  });

  el('again').addEventListener('click', startQuiz);
  el('back2').addEventListener('click', renderQuizStart);
}

/* ---------------- Vokabeln ---------------- */

/* Leitner, auf wenige Tage getrimmt. Normale SRS-Intervalle sind hier sinnlos. */
var BOXES = [10 * 60e3, 60 * 60e3, 4 * 3600e3, 24 * 3600e3, 48 * 3600e3];
var CATS = [
  { k: 'all',      l: 'Alle' },
  { k: 'fach',     l: 'Fachbegriffe' },
  { k: 'pruefung', l: 'Prüfungssprache' },
  { k: 'praxis',   l: 'Praxiskommandos' }
];
var vocabCat = 'all';
var vocabMode = 'list';
var card = null, cardShown = false;

function scopedVocab() {
  return vocabCat === 'all' ? VOCAB.slice()
    : VOCAB.filter(function (t) { return t.cat === vocabCat; });
}

function dueCards() {
  var now = Date.now();
  var pool = scopedVocab();
  var due = pool.filter(function (t) {
    var s = state.srs[t.id];
    return s && s.due <= now;
  }).sort(function (a, b) { return state.srs[a.id].due - state.srs[b.id].due; });
  var fresh = pool.filter(function (t) { return !state.srs[t.id]; });
  return { due: due, fresh: fresh };
}

function renderVocab() {
  el('vocab-cats').innerHTML = CATS.map(function (c) {
    var n = c.k === 'all' ? VOCAB.length
      : VOCAB.filter(function (t) { return t.cat === c.k; }).length;
    return '<button data-c="' + c.k + '" aria-pressed="' + (vocabCat === c.k) + '">'
      + esc(c.l) + '<span class="n">' + n + '</span></button>';
  }).join('');
  el('vocab-cats').querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () { vocabCat = b.dataset.c; card = null; renderVocab(); });
  });

  el('vocab-modes').innerHTML =
      '<button data-m="list"  aria-pressed="' + (vocabMode === 'list')  + '">Liste</button>'
    + '<button data-m="cards" aria-pressed="' + (vocabMode === 'cards') + '">Karten</button>';
  el('vocab-modes').querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () { vocabMode = b.dataset.m; renderVocab(); });
  });

  if (vocabMode === 'list') { el('vocab-cards').hidden = true; renderVocabList(); }
  else { el('vocab-list').hidden = true; renderCard(); }
}

function renderVocabList() {
  var box = el('vocab-list');
  box.hidden = false;
  var list = scopedVocab();
  if (!list.length) { box.innerHTML = '<p class="empty">Noch keine Vokabeln.</p>'; return; }

  /* nach Untergruppe bündeln, Reihenfolge wie in der Datei */
  var order = [], groups = {};
  list.forEach(function (t) {
    var g = t.sub || '';
    if (!groups[g]) { groups[g] = []; order.push(g); }
    groups[g].push(t);
  });

  box.innerHTML = order.map(function (g) {
    return (g ? '<h3>' + esc(g) + '</h3>' : '')
      + '<ul class="vlist">' + groups[g].map(function (t) {
          return '<li><button class="speak small" data-say="' + esc(t.en) + '">' + SPK + '</button>'
            + '<div><span class="v-en">' + esc(t.en) + '</span><br>'
            + '<span class="v-de">' + esc(t.de) + '</span>'
            + (t.explDe ? '<span class="v-x">' + esc(t.explDe) + '</span>' : '')
            + '</div></li>';
        }).join('') + '</ul>';
  }).join('');

  box.querySelectorAll('[data-say]').forEach(function (b) {
    b.addEventListener('click', function () { speak(b.dataset.say); });
  });
}

function pickCard() {
  var d = dueCards();
  if (d.due.length) return d.due[0];
  if (d.fresh.length) return d.fresh[0];
  return null;
}

function renderCard() {
  var box = el('vocab-cards');
  box.hidden = false;
  if (!card) { card = pickCard(); cardShown = false; }

  if (!card) {
    var next = Object.keys(state.srs)
      .map(function (k) { return state.srs[k].due; })
      .filter(function (d) { return d > Date.now(); })
      .sort(function (a, b) { return a - b; })[0];
    box.innerHTML = '<div class="card empty">Alles wiederholt.'
      + (next ? '<br>Nächste Karte ' + new Date(next).toLocaleString('de-DE') : '')
      + '</div>';
    return;
  }

  var d = dueCards();
  var h = '<p class="eyebrow">fällig ' + d.due.length + ' · neu ' + d.fresh.length + '</p>';
  h += '<div class="card flash">';
  h += '<div class="term">' + esc(card.en) + '</div>';
  if (cardShown) {
    h += '<div class="de">' + esc(card.de) + '</div>';
    if (card.explDe) h += '<div class="expl">' + esc(card.explDe) + '</div>';
    if (card.source) h += '<div class="src">Handbuch ' + esc(card.source) + '</div>';
  }
  h += '</div>';
  h += '<div class="btn-row"><button class="ghost small" id="c-say">' + SPK + ' Vorlesen</button></div>';

  if (!cardShown) {
    h += '<div class="btn-row"><button class="primary" id="c-show">Antwort zeigen</button></div>';
  } else {
    h += '<div class="grade">'
      + '<button data-g="0">Nochmal</button>'
      + '<button data-g="1">Gut</button>'
      + '<button data-g="2">Einfach</button></div>';
  }

  box.innerHTML = h;
  el('c-say').addEventListener('click', function () { speak(card.en); });
  if (el('c-show')) el('c-show').addEventListener('click', function () { cardShown = true; renderCard(); });
  box.querySelectorAll('[data-g]').forEach(function (b) {
    b.addEventListener('click', function () { grade(parseInt(b.dataset.g, 10)); });
  });
}

function grade(g) {
  var s = state.srs[card.id] || { box: 0 };
  if (g === 0) s.box = 0;
  else if (g === 1) s.box = Math.min(s.box + 1, BOXES.length - 1);
  else s.box = Math.min(s.box + 2, BOXES.length - 1);
  s.due = Date.now() + BOXES[s.box];
  s.n = (s.n || 0) + 1;
  state.srs[card.id] = s;
  save();
  card = null; cardShown = false;
  renderCard();
}

/* ---------------- Start ---------------- */

el('hdr-sub').textContent = QUESTIONS.length + ' Fragen · ' + VOCAB.length + ' Vokabeln · 80 % zum Bestehen';
showTab('learn');

})();
</script>
